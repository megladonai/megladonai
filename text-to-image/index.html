<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Text to Image Generator — Megladon AI</title>
<meta name="description" content="Describe an image in words and get an AI-generated picture in seconds. Free, no sign-up.">
<link rel="icon" type="image/png" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #05070F;
    --bg-deep: #020308;
    --teal: #2BE0C4;
    --teal-dim: rgba(43,224,196,0.14);
    --text: #EAF0F4;
    --text-muted: #7C8AAC;
    --glass-bg: rgba(255,255,255,0.045);
    --glass-bg-hover: rgba(255,255,255,0.075);
    --glass-border: rgba(255,255,255,0.10);
    --glass-highlight: rgba(255,255,255,0.28);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  body::before{
    content:"";
    position: fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse 60% 45% at 15% 8%, rgba(43,224,196,0.07), transparent 60%),
      radial-gradient(ellipse 55% 40% at 88% 12%, rgba(80,120,255,0.06), transparent 60%),
      var(--bg);
  }
  a{ color: inherit; text-decoration: none; }
  h1{ font-family:'Bricolage Grotesque', sans-serif; letter-spacing:-0.02em; }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.06em; }

  header{
    position: relative;
    z-index: 2;
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 6vw;
  }
  .logo{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:0.9rem; }
  .logo img{ width:26px; height:26px; border-radius:50%; box-shadow:0 0 14px rgba(43,224,196,0.35); }
  .back-link{ font-size:0.8rem; color: var(--text-muted); display:flex; align-items:center; gap:6px; }
  .back-link:hover{ color: var(--teal); }
  .back-link svg{ width:14px; height:14px; }

  main{
    position: relative;
    z-index: 2;
    flex:1;
    display:flex; flex-direction:column; align-items:center;
    padding: 30px 6vw 80px;
  }

  /* ---------- FLOATING BACKGROUND GALLERY ---------- */
  .floating-gallery{
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .floating-gallery::after{
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 65% 55% at 50% 42%, rgba(5,7,15,0.55), rgba(5,7,15,0.88) 68%),
      var(--bg);
  }
  .float-pic{
    position: absolute;
    border-radius: 16px;
    object-fit: cover;
    border: 1px solid var(--glass-border);
    box-shadow: 0 20px 45px rgba(0,0,0,0.55);
    opacity: 0.4;
    filter: saturate(0.95);
    animation: floatCard ease-in-out infinite;
  }
  @keyframes floatCard{
    0%, 100%{ transform: translateY(0) rotate(var(--r, 0deg)); }
    50%{ transform: translateY(-16px) rotate(var(--r, 0deg)); }
  }
  @media (prefers-reduced-motion: reduce){
    .float-pic{ animation: none; }
  }
  @media (max-width: 900px){
    .float-pic.hide-mobile{ display: none; }
  }

  .eyebrow{
    font-size: 0.62rem; color: var(--teal); text-transform: uppercase;
    background: var(--glass-bg); border:1px solid var(--glass-border);
    padding: 5px 12px; border-radius: 100px; margin-bottom: 18px;
  }
  h1{ font-size: clamp(1.6rem, 3.4vw, 2.3rem); text-align:center; margin-bottom: 10px; }
  main > p{ color: var(--text-muted); max-width: 480px; text-align:center; margin-bottom: 34px; font-size: 0.95rem; line-height:1.6; }

  .panel{
    width: 100%; max-width: 640px;
    background: var(--glass-bg);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 var(--glass-highlight), 0 8px 32px rgba(0,0,0,0.25);
    border-radius: 18px;
    padding: 26px;
  }

  textarea{
    width: 100%; min-height: 90px; resize: vertical;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.92rem;
    outline: none;
    transition: border-color 0.2s ease;
  }
  textarea:focus{ border-color: var(--teal); }
  textarea::placeholder{ color: var(--text-muted); }

  .row{ display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; }

  .btn-primary{
    background: var(--teal); color:#04231E; font-weight:600;
    padding: 13px 26px; border-radius: 9px; font-size:0.92rem;
    border:none; cursor:pointer;
    box-shadow: 0 0 26px rgba(43,224,196,0.32);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 0 36px rgba(43,224,196,0.48); }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }

  .btn-secondary{
    border: 1px solid var(--glass-border); color: var(--text);
    padding: 13px 26px; border-radius: 9px; font-size:0.92rem;
    background: transparent; cursor:pointer;
  }
  .btn-secondary:hover{ border-color: var(--teal); background: rgba(43,224,196,0.06); }

  .result-wrap{
    width: 100%; max-width: 640px; margin-top: 22px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .result-wrap.show{ display:flex; }
  .result-wrap img{
    width: 100%; border-radius: 16px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }

  .status{
    margin-top: 18px; font-size: 0.85rem; color: var(--text-muted);
    display:none; align-items:center; gap:10px;
  }
  .status.show{ display:flex; }
  .spinner{
    width:16px; height:16px; border-radius:50%;
    border: 2px solid var(--glass-border); border-top-color: var(--teal);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .error-box{
    margin-top:18px; padding:12px 16px; border-radius:10px;
    background: rgba(255,80,80,0.08); border:1px solid rgba(255,80,80,0.3);
    color:#ff9b9b; font-size:0.85rem; display:none; max-width:640px; width:100%;
    align-items:flex-start; gap:8px;
  }
  .error-box.show{ display:flex; }
  .error-box svg{ width:16px; height:16px; flex-shrink:0; margin-top:1px; }

  footer{
    position: relative;
    z-index: 2;
    text-align:center; padding: 24px; color: var(--text-muted); font-size:0.78rem;
  }
</style>
</head>
<body>

<div class="floating-gallery" aria-hidden="true">
  <img class="float-pic" loading="lazy" alt="" style="top:6%; left:5%; width:150px; height:150px; --r:-6deg; animation-duration:9s;" src="https://image.pollinations.ai/prompt/vibrant%20abstract%20digital%20art%20colorful%20smoke?width=320&height=320&seed=101&nologo=true">
  <img class="float-pic" loading="lazy" alt="" style="top:12%; right:7%; width:170px; height:170px; --r:5deg; animation-duration:11s; animation-delay:0.6s;" src="https://image.pollinations.ai/prompt/cyberpunk%20city%20street%20neon%20at%20night?width=320&height=320&seed=102&nologo=true">
  <img class="float-pic hide-mobile" loading="lazy" alt="" style="top:30%; left:2%; width:130px; height:130px; --r:4deg; animation-duration:8s; animation-delay:1.1s;" src="https://image.pollinations.ai/prompt/fantasy%20dragon%20flying%20over%20mountains%20digital%20art?width=320&height=320&seed=103&nologo=true">
  <img class="float-pic" loading="lazy" alt="" style="top:26%; right:3%; width:150px; height:150px; --r:-4deg; animation-duration:10s; animation-delay:0.3s;" src="https://image.pollinations.ai/prompt/astronaut%20floating%20in%20space%20nebula%20digital%20art?width=320&height=320&seed=104&nologo=true">
  <img class="float-pic hide-mobile" loading="lazy" alt="" style="bottom:26%; left:4%; width:160px; height:160px; --r:6deg; animation-duration:12s; animation-delay:1.4s;" src="https://image.pollinations.ai/prompt/portrait%20of%20a%20fox%20in%20fantasy%20forest%20digital%20art?width=320&height=320&seed=105&nologo=true">
  <img class="float-pic" loading="lazy" alt="" style="bottom:30%; right:5%; width:140px; height:140px; --r:-5deg; animation-duration:9.5s; animation-delay:0.9s;" src="https://image.pollinations.ai/prompt/surreal%20floating%20islands%20digital%20art?width=320&height=320&seed=106&nologo=true">
  <img class="float-pic hide-mobile" loading="lazy" alt="" style="bottom:8%; left:9%; width:150px; height:150px; --r:3deg; animation-duration:10.5s; animation-delay:0.4s;" src="https://image.pollinations.ai/prompt/futuristic%20sports%20car%20concept%20art?width=320&height=320&seed=107&nologo=true">
  <img class="float-pic" loading="lazy" alt="" style="bottom:6%; right:9%; width:160px; height:160px; --r:-3deg; animation-duration:11.5s; animation-delay:1.2s;" src="https://image.pollinations.ai/prompt/underwater%20coral%20reef%20fantasy%20art?width=320&height=320&seed=108&nologo=true">
  <img class="float-pic hide-mobile" loading="lazy" alt="" style="top:4%; left:38%; width:120px; height:120px; --r:5deg; animation-duration:8.5s; animation-delay:0.7s;" src="https://image.pollinations.ai/prompt/majestic%20lion%20digital%20painting?width=320&height=320&seed=109&nologo=true">
  <img class="float-pic hide-mobile" loading="lazy" alt="" style="bottom:2%; left:42%; width:120px; height:120px; --r:-4deg; animation-duration:9s; animation-delay:1.0s;" src="https://image.pollinations.ai/prompt/cherry%20blossom%20japanese%20garden%20digital%20art?width=320&height=320&seed=110&nologo=true">
  <img class="float-pic hide-mobile" loading="lazy" alt="" style="top:45%; left:1%; width:110px; height:110px; --r:4deg; animation-duration:10s; animation-delay:0.2s;" src="https://image.pollinations.ai/prompt/steampunk%20airship%20in%20clouds%20digital%20art?width=320&height=320&seed=111&nologo=true">
  <img class="float-pic hide-mobile" loading="lazy" alt="" style="top:48%; right:1%; width:110px; height:110px; --r:-6deg; animation-duration:11s; animation-delay:1.5s;" src="https://image.pollinations.ai/prompt/galaxy%20swirl%20abstract%20art?width=320&height=320&seed=112&nologo=true">
</div>

<header>
  <a href="../index.html" class="logo">
    <img src="../assets/logo.png" alt="Megladon AI logo">
    MEGLADON AI
  </a>
  <a href="../index.html#cat-ai" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to Tools
  </a>
</header>

<main>
  <div class="eyebrow mono">FREE · NO SIGN-UP · AI POWERED</div>
  <h1>AI Text to Image Generator</h1>
  <p>Describe what you want to see, and let AI turn your words into a picture.</p>

  <div class="panel">
    <textarea id="promptInput" placeholder="e.g. a cat wearing sunglasses, riding a skateboard, digital art"></textarea>
    <div class="row">
      <button class="btn-primary" id="generateBtn">Generate Image</button>
      <button class="btn-secondary" id="clearBtn">Clear</button>
    </div>
    <div class="status" id="statusBox">
      <div class="spinner"></div>
      <span>Generating your image, please wait...</span>
    </div>
    <div class="error-box" id="errorBox"></div>
  </div>

  <div class="result-wrap" id="resultWrap">
    <img id="resultImage" alt="Generated image">
    <a class="btn-secondary" id="downloadBtn" download="megladon-ai-image.png">Download Image</a>
  </div>
</main>

<footer>© 2026 Megladon AI. Built for speed.</footer>

<script>
  const promptInput = document.getElementById('promptInput');
  const generateBtn = document.getElementById('generateBtn');
  const clearBtn = document.getElementById('clearBtn');
  const statusBox = document.getElementById('statusBox');
  const errorBox = document.getElementById('errorBox');
  const resultWrap = document.getElementById('resultWrap');
  const resultImage = document.getElementById('resultImage');
  const downloadBtn = document.getElementById('downloadBtn');

  function showError(message){
    errorBox.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span></span>';
    errorBox.querySelector('span').textContent = message;
    errorBox.classList.add('show');
  }

  async function generateImage(){
    const prompt = promptInput.value.trim();
    errorBox.classList.remove('show');
    errorBox.innerHTML = '';

    if (!prompt){
      showError('Please describe what image you want first.');
      return;
    }

    generateBtn.disabled = true;
    statusBox.classList.add('show');
    resultWrap.classList.remove('show');

    try {
      const res = await fetch('/.netlify/functions/generate-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt }),
      });

      const data = await res.json();

      if (!res.ok){
        throw new Error(data.error || 'Something went wrong. Please try again.');
      }

      resultImage.src = data.image;
      downloadBtn.href = data.image;
      resultWrap.classList.add('show');
    } catch (err){
      showError(err.message || 'Something went wrong. Please try again.');
    } finally {
      generateBtn.disabled = false;
      statusBox.classList.remove('show');
    }
  }

  generateBtn.addEventListener('click', generateImage);
  clearBtn.addEventListener('click', () => {
    promptInput.value = '';
    resultWrap.classList.remove('show');
    errorBox.classList.remove('show');
  });
</script>

</body>
</html>
